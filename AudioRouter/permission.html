<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Setup Device Permissions</title>
  <style>
    body {
      background-color: #FEF7FF;
      color: #1D1B20;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #F3EDF7;
      padding: 32px;
      border-radius: 16px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #49454F;
      margin-bottom: 24px;
    }
    .spinner {
      border: 4px solid #CAC4D0;
      border-top: 4px solid #6750A4;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Device Access Request</h1>
    <p>Please click <strong>Allow</strong> when the browser prompts for microphone permissions. This enables the extension to read the output speaker labels.</p>
    <div class="spinner"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
